# Example manifest for the novel-pos single-shot pipeline (ADR-001 修订3).
# Run: python run_novel_pos.py --manifest config/manifest.example.yaml
# Paths are resolved relative to THIS file's directory unless absolute.

gs_ply: scene.ply                        # existing Gaussian Splatting (.ply, 3DGS / SH0+)

novel_view:
  render_image: nv_render.png            # REQUIRED: rendered-from-GS RGB (MASt3R mono input)
  completion_image: nv_ai.png            # REQUIRED: AI completion RGB

  # REQUIRED — render camera, used to project the GS into the render view.
  # CONVENTION (contract §2): pose is camera-to-world, quaternion WXYZ, OpenCV axes (z forward).
  pose:
    translation: [0.0, 0.0, 0.0]
    quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]   # [w, x, y, z]
  intrinsics:                               # pixel intrinsics for render_image ORIGINAL resolution
    width: 1024
    height: 1024
    fx: 800.0
    fy: 800.0
    cx: 512.0
    cy: 512.0

panorama:                                # OPTIONAL — metadata only
  image: pano.png
  pose: {translation: [0.0, 0.0, 0.0], quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]}

output_ply: updated.ply                  # merged output (degraded GS + new completion points)

gs_degrade:
  opacity_threshold: 0.5                 # post-sigmoid alpha threshold for degradation
confidence:
  update_conf_percentile: 50             # keep completion points with conf above this percentile
validation_gate:                         # report-only: median render<->completion residual / scene depth
  max_rel_residual: 0.05
